# AutoBleem - the RetroArch ROM folders whose name is not the name of their database.
#
# The background scan turns each <roms>/<folder>/ into the playlist of the database it is named after
# ("Nintendo - Nintendo Entertainment System" -> "Nintendo - Nintendo Entertainment System.lpl"). A folder
# named otherwise is listed here as "<folder>=<database>", '#' starts a comment. Two folders may name the
# same database; their games then share one playlist.
#
# Arcade sets: RetroArch's own scanner files them under "FBNeo - Arcade Games" whatever the folder, and the
# Neo Geo MVS/AES sets are in that database too.
Arcade=FBNeo - Arcade Games
SNK - Neo Geo=FBNeo - Arcade Games
