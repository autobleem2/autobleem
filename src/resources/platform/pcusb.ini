# AutoBleem platform paths - the PC USB stick, a 32-bit Debian appliance (see psc.ini for what each key means).
#
# The same appliance as the Raspberry Pi (payload_linux/install.sh lays it out): RetroArch's own standard
# tree under RetroArch/ on the data partition, the binary in /usr/local (the site's i386 build) or the
# distribution's package.
retroarch_dir=RetroArch
retroarch_core=cores/pcsx_rearmed_libretro.so
retroarch_binary=/usr/local/bin/retroarch;/usr/bin/retroarch
retroarch_roms_dir=RetroArch/roms
retroarch_bios_dir=RetroArch/system
download_command=curl -sfL -m 20 -o "%o" "%u"
# the launcher's online update (Options -> Updates): the download repository, how a package is fetched
# from it - no short timeout, a package is tens of MB - and where the PC's RetroArch builds are listed
repo_url=https://autobleem.retromenele.pl
update_download_command=curl -sfL -o "%o" "%u"
# what an extension (the AutoBleem Store) fetches with: continues a partly downloaded file (see psc.ini)
store_download_command=curl -sfL -C - -o "%o" "%u"
retroarch_catalog=pc/retroarch/latest.json
usb_root=/media/autobleem
# RAM for the logs and hand-over files: systemd makes /run/autobleem for the session (RuntimeDirectory=);
# /tmp when started some other way (Raspberry Pi OS keeps /tmp on the system partition, not the data one)
runtime_dir=/run/autobleem;/tmp/autobleem
