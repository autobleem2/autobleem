# AutoBleem - the RetroArch databases that never get a ROM folder.
#
# The background scan creates RetroArch/roms/<database>/ for every database an installed core's .info lists, when
# neither that folder nor an alias for it in roms_folders.cfg exists - somewhere to drop each system's games. The
# names here are left out: not games (a media player, a music player, a tech demo), or played somewhere else. One
# database name per line as the .info files spell it, any case, '#' starts a comment. roms_systems.cfg (the first
# set the installers create) is not touched by this list.
#
# Not games
FFmpeg
Music
Redbook
VMU
2048
Pong
Gong
#
# Versioned MAME builds: their sets are MAME's own and play through the "MAME" folder
MAME 2000
MAME 2003
MAME 2003-Plus
MAME 2003 Xtreme
MAME 2010
MAME 2014
MAME 2015
MAME 2016
#
# PlayStation: its games live in Games/ and play through pcsx, never in RetroArch/roms
Sony - PlayStation
