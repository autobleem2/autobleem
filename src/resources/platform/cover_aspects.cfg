# The typical box-art aspect of each RetroArch system: "<database name>=<width>:<height>", one per line, the
# name spelled as RetroArch's playlists and databases spell it (the roms_systems.cfg names). Read by the launcher's
# carousel (core's CoverAspectTable) for a game that has NO art of its own: the placeholder box is drawn at this
# shape. A game with art is drawn at its art's own shape and never looks here. A system that is not listed - or
# any App - is 1:1. Whole numbers 1..99; a line that is not that is ignored; '#' starts a comment.
#
# The shapes are estimates of the usual retail box (the Named_Boxarts scans of libretro-thumbnails follow them
# loosely) - one database name covers the US, Japanese and PAL releases, whose boxes differ, so each line is the
# common case. Change a number here and the placeholder follows; nothing is compiled in.

# Nintendo
Nintendo - Nintendo Entertainment System=5:7
Nintendo - Family Computer Disk System=3:4
Nintendo - Super Nintendo Entertainment System=7:5
Nintendo - Nintendo 64=7:5
Nintendo - Game Boy=1:1
Nintendo - Game Boy Color=1:1
Nintendo - Game Boy Advance=1:1

# Sega
Sega - SG-1000=5:7
Sega - Master System - Mark III=5:7
Sega - Mega Drive - Genesis=5:7
Sega - 32X=5:7
Sega - Game Gear=5:7
Sega - Mega-CD - Sega CD=3:4

# NEC
NEC - PC Engine - TurboGrafx 16=5:7
NEC - PC Engine SuperGrafx=5:7
NEC - PC Engine CD - TurboGrafx-CD=1:1

# SNK
SNK - Neo Geo=7:5
SNK - Neo Geo CD=1:1

# Atari
Atari - 2600=5:7
Atari - 7800=5:7

# Arcade: flyers / marquees, portrait
Arcade=3:4
MAME=3:4
FBNeo - Arcade Games=3:4
FB Alpha - Arcade Games=3:4
# Computers and big boxes (the designer, 2026-09-30); Saturn and Dreamcast left out on purpose - their boxes vary
# too much by region, 1:1 is the honest fallback
Commodore - Amiga=4:5
Commodore - 64=3:4
DOS=4:5
ScummVM=4:5
# Atari handhelds and the Jaguar: portrait boxes
Atari - Lynx=5:7
Atari - Jaguar=5:7
