# AutoBleem platform paths - the PlayStation Classic (the console).
#
# Read once at start by EnvironmentSetup as resources/platform/<platform>.ini, where <platform> is the name
# the build was made for: psc, rpi, pcusb, win or pc (Env::platformName(), from CMake's AB_TARGET).
# Everything that differs between the targets about where RetroArch is goes here, not in #ifdefs.
#
#   retroarch_dir     RetroArch's tree: the binary, playlists/, info/, cores/, retroarch.cfg. Relative to the
#                     USB root.
#   retroarch_core    the PS1 core the exported playlist names. Relative to retroarch_dir.
#   retroarch_binary  where the RetroArch executable may be, ';'-separated candidates tried in order;
#                     relative to retroarch_dir unless absolute. "RetroArch" in the system menu and Square
#                     on a game are offered only when one of them exists.
#   retroarch_roms_dir  the other systems' ROMs, a folder per system named as RetroArch's databases are
#                     ("Nintendo - Nintendo Entertainment System"); the background scan writes a playlist
#                     for each. Relative to the USB root.
#   retroarch_bios_dir  RetroArch's system directory - the BIOS files the cores look for (retroarch.cfg's
#                     system_directory points here). Relative to the USB root.
#   download_command  a shell command that fetches the URL %u into the file %o and exits 0 only on success,
#                     with its own timeout (the app has no HTTP client): what the scan fetches box art
#                     and the databases bundle with, when config.ini's online=true and the server answers
#                     a probe. Empty: this platform never goes online.
#   repo_url, update_download_command
#                     the launcher's online update (Options -> Updates): the download repository, and how a
#                     package is fetched from it (%u, %o, no short timeout; %r is the launcher's own
#                     folder, Autobleem/bin/autobleem). Empty: no update check.
#   store_download_command
#                     what an extension (the AutoBleem Store) fetches a file with: %u, %o, %r as above, and it
#                     must continue a %o that is partly there (abfetch --continue, curl -C -) - a game is
#                     hundreds of MB. Empty: the update's command (then a stopped download starts over).
#   retroarch_catalog where that repository lists this platform's RetroArch builds, relative to repo_url
#                     ("rpi/retroarch/latest.json"). Empty: the launcher does not update RetroArch here.
#   launch_mode       script (the default): a game starts through Autobleem/rc/launch.sh / launch_rb.sh;
#                     direct: the launcher runs the emulator itself (the Windows product).
#   core_extension    the cores' file extension - .so (the default), .dll on Windows.
#   pcsx_dir          where pcsx-ab is for a direct launch, relative to the resources dir unless absolute.
#   pcsxnxt_dir       the same for pcsx-abnxt (Options -> "PS1 Emulator"); a chosen emulator whose folder
#                     has no binary falls back to the other, then to RetroArch's PS1 core - as launch.sh does.
#   runtime_dir       RAM for what one run writes and nobody keeps - the logs, the hand-over files
#                     (autobleem-main's docs/archive/quiet-stick-plan.md): ';'-separated absolute candidates, the first that exists
#                     wins, else the last. Empty: System/Runtime on the stick (a machine without tmpfs).
#   usb_root          what this platform calls its USB root - the prefix in the playlists it writes. Read
#                     by UpdateRoms.exe, which writes those playlists from a PC.
#
# The console's stick keeps everything of RetroArch's under one folder: RetroArch/bin is RetroArch's own
# tree (the binary from github.com/autobleem/retroarch-psc, the cores, assets, playlists, saves), RetroArch/bios
# the BIOS files, RetroArch/roms the other systems' games. The launch scripts are AutoBleem's own
# (Autobleem/rc/launch_rb.sh, retroarch.sh) - RetroBoot's tree is not needed any more.
retroarch_dir=RetroArch/bin
retroarch_core=cores/pcsx_rearmed_libretro.so
retroarch_binary=retroarch
retroarch_roms_dir=RetroArch/roms
retroarch_bios_dir=RetroArch/bios
# tmpfs: the logs live here unless "Keep logs on the stick" is on (a crash copies them to System/Logs)
runtime_dir=/tmp/autobleem
# the scan stays offline on the console (no box art fetched)
download_command=
# the online update (2026-09-23): only a console with a network checks - the AutoBleem kernel's WiFi; a stock
# console has none, and the launcher asks for a default route before it runs anything. It fetches with
# abfetch, the launcher's own HTTPS client next to it on the stick (%r = the launcher's folder), not with
# whatever the kernel payload carries: the AutoBleem 1.x kernel's has no curl. Stall-proof rather than
# time-limited: the package is ~60 MB over whatever WiFi there is.
repo_url=https://autobleem.retromenele.pl
update_download_command="%r/abfetch" --connect-timeout 20 --stall-timeout 60 -o "%o" "%u"
store_download_command="%r/abfetch" --continue --connect-timeout 20 --stall-timeout 60 -o "%o" "%u"
usb_root=/media
