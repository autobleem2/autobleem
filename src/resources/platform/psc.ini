# AutoBleem platform paths - the PlayStation Classic (the console).
#
# Read once at start by Env::loadPlatformConfig() as resources/platform/<platform>.ini, where <platform> is
# the name the build was made for: psc, rpi or pc (Env::platformName()). Everything that differs between
# the targets about where RetroArch is goes here, not in #ifdefs.
#
#   retroarch_dir     RetroArch's tree: playlists/, info/, cores/, retroarch.cfg. Relative to the USB root.
#   retroarch_core    the PS1 core the exported playlist names. Relative to retroarch_dir.
#   retroarch_binary  where the RetroArch executable may be, ';'-separated candidates tried in order;
#                     relative to retroarch_dir unless absolute. "RetroArch" in the system menu and Square
#                     on a game are offered only when one of them exists.
#
# The console runs RetroBoot: everything under /media/retroarch, its own binary included.
retroarch_dir=retroarch
retroarch_core=cores/km_pcsx_rearmed_neon_libretro.so
retroarch_binary=retroarch
