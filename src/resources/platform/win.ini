# AutoBleem platform paths - the Windows product (see psc.ini for what each key means).
#
# The program lives in its install folder (the resources next to the exe); every path here is relative
# to the user's data tree (Documents\AutoBleem by default - EnvironmentSetup::fromWindowsInstall), where
# the installer puts the official RetroArch into RetroArch\bin (RetroArch-Win64-setup.exe /S /D=...).
retroarch_dir=RetroArch/bin
retroarch_core=cores/pcsx_rearmed_libretro.dll
retroarch_binary=retroarch.exe
retroarch_roms_dir=RetroArch/roms
retroarch_bios_dir=RetroArch/bin/system
core_extension=.dll
# games are started directly (no rc/*.sh): pcsx-ab from <program>/emu, pcsx-abnxt from <program>/emunxt
# (Options -> "PS1 Emulator"; either missing falls back to the other, both to RetroArch's PS1 core),
# RetroArch from retroarch_dir
launch_mode=direct
pcsx_dir=emu
pcsxnxt_dir=emunxt
# curl.exe ships with Windows 10 and later
download_command=curl -sfL -m 20 -o "%o" "%u"
repo_url=https://autobleem.retromenele.pl
update_download_command=curl -sfL -o "%o" "%u"
# what an extension (the AutoBleem Store) fetches with: continues a partly downloaded file (see psc.ini)
store_download_command=curl -sfL -C - -o "%o" "%u"
# no RetroArch catalog: on Windows RetroArch is the official build, updated by its own installer
retroarch_catalog=
