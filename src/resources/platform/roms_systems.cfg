# AutoBleem - the RetroArch ROM systems: one folder per line under RetroArch/roms/, named exactly as
# RetroArch's databases and playlists name them, so "Import Content -> Scan Directory" on roms/ sorts every
# game into the matching playlist and the background scan writes <system>.lpl for it. '#' starts a comment.
#
# Every installer creates these folders (empty) so a user has somewhere to drop each system's games:
# payload_linux/install.sh (Pi / PC stick) and the Windows setup helper (apps/installer) both read this
# file. Keep it the single source of truth - do not hard-code the list anywhere else.
