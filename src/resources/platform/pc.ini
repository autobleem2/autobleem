# AutoBleem platform paths - a development machine (see psc.ini for what each key means).
#
# The fake USB tree (tools/make_usb.py) is laid out like the console's stick, so the console's values apply;
# nothing is launched on a dev host anyway (the splash runner).
retroarch_dir=RetroArch/bin
retroarch_core=cores/pcsx_rearmed_libretro.so
retroarch_binary=retroarch
retroarch_roms_dir=RetroArch/roms
retroarch_bios_dir=RetroArch/bios
# curl.exe ships with Windows 10 and later, and is on every Linux/macOS dev box
download_command=curl -sfL -m 20 -o "%o" "%u"
# the online update, for trying the flow on a dev host (AB_UPDATE_PLATFORM=rpi in the environment makes it
# look for the Pi package; the "apply" step is the Pi's alone)
repo_url=https://autobleem.retromenele.pl
update_download_command=curl -sfL -o "%o" "%u"
