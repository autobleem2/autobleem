# The PC (a dev host): the same choices as the Raspberry Pi.
# Which core plays which RetroArch playlist on this platform: "<database name>=<part of a core's display
# name>", one per line, ahead of the .info mapping (the first installed core whose .info lists the database,
# most extensions first). Read by RetroArchService from resources/platform/<platform>.cores.cfg. Comments and
# blank lines are ignored.
