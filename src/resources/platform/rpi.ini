# AutoBleem platform paths - the Raspberry Pi (see psc.ini for what each key means).
#
# The installer builds RetroArch from source into /usr/local (or takes the distribution's package), and
# lays RetroArch's own standard tree out under RetroArch/ on the data partition (payload_rpi/install.sh).
retroarch_dir=RetroArch
retroarch_core=cores/pcsx_rearmed_libretro.so
retroarch_binary=/usr/local/bin/retroarch;/usr/bin/retroarch
retroarch_roms_dir=RetroArch/roms
