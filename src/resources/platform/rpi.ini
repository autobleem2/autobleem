# AutoBleem platform paths - the Raspberry Pi (see psc.ini for what each key means).
#
# The installer builds RetroArch from source into /usr/local (or takes the distribution's package), and
# lays RetroArch's own standard tree out under RetroArch/ on the data partition (payload_linux/install.sh).
retroarch_dir=RetroArch
retroarch_core=cores/pcsx_rearmed_libretro.so
retroarch_binary=/usr/local/bin/retroarch;/usr/bin/retroarch
retroarch_roms_dir=RetroArch/roms
retroarch_bios_dir=RetroArch/system
download_command=curl -sfL -m 20 -o "%o" "%u"
# the launcher's online update (Options -> Updates): the download repository, and how a package is fetched
# from it - no short timeout, a package is tens of MB
repo_url=https://autobleem.retromenele.pl
update_download_command=curl -sfL -o "%o" "%u"
retroarch_catalog=rpi/retroarch/latest.json
usb_root=/media/autobleem
