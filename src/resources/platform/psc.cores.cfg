# The PlayStation Classic with RetroBoot.
# Which core plays which RetroArch playlist on this platform: "<database name>=<core>", one per line, ahead of
# the .info mapping (the first installed core whose .info lists the database, most extensions first, equal
# counts by file name). <core> is the core's file stem - "km_snes9x2010" is cores/km_snes9x2010_libretro.so -
# so the same stick always gives the same core; a display name (whole, or a part of it) works too, but the
# stem is the one that cannot match two builds. Read by RetroArchService from
# resources/platform/<platform>.cores.cfg. Comments and blank lines are ignored.
#
# The picks are the plain km_ builds (the Xtreme and Amped builds are the player's choice, per game: the
# game editor's Core row) except where the standard build is another core:
#   Atari 2600 km_stella, Lynx km_handy, C64 km_vice_c64_xtreme and Saturn km_yabause_xtreme (the pack has
#   no plain build of either), Amstrad CPC km_cap32, MSX km_bluemsx, 3DO km_opera, PC-98 km_np2kai,
#   X68000 km_px68k, DOOM km_prboom, Nintendo DS km_desmume (km_melonds is the heavier one).
# FBNeo and MAME 2003 Plus play sets their own .info does not list: "FB Alpha - Arcade Games" and "MAME" have
# no better core in the pack.
Nintendo - Nintendo Entertainment System=km_fceumm
