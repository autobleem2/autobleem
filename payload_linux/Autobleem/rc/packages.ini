# autobleem-packages 1
#
# Which of the player's own files are which game (docs/packages.md in autobleem-main, section 4). The launcher
# reads this table - and the player's own Packages/packages.ini first, so his rows win - and matches it against the
# folders under Packages/ by file name (any letter case). Nothing is ever written into the player's folders.
#
# A row: [row-id] is the game's id (saves are filed under it: never change it once shipped), then
#   kind=     the content kind an engine lists in its app.ini Uses=
#   title=    the game's name (not translated)
#   match=    the files that must all exist, relative to the folder, ';' between them
#   main=     the main file (default: the first match)
#   size=     the exact size in bytes of the first match file (tells shareware from retail)
#   magic=    up to four characters the main file starts with
#   variant=  free text for the picker's second line
#   licence=  shown in the info view
#   start=    dos-game: FILE|Title;FILE|Title      set.<name>=  dos-game: a DOSBox setting     mapper=  dos-game
# Order matters: a specific row before a generic one. A comment line starts with # or ;
#
# Only [quake] was checked against a real copy; every other row is marked 'verify' and was taken from the engines'
# and the published lists of identifying files.

# verify against a real copy
[doom1-shareware]
kind=doom-iwad
title=Doom (Shareware)
match=DOOM1.WAD
magic=IWAD
licence=Shareware

