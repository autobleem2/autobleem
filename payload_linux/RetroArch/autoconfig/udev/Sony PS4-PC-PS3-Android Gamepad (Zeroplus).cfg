# A third-party "PS4/PC/PS3/Android Gamepad" (Zeroplus 0c12:0e16, sold under many names, reports itself as
# Sony Interactive Entertainment). libretro's autoconfig bundle has no profile for it, so RetroArch left it
# unmapped. Through hid-generic it is a DualShock 4 as far as evdev is concerned: 14 buttons in the DS4 HID
# report order (Square, Cross, Circle, Triangle, L1, R1, L2, R2, Share, Options, L3, R3, PS, touchpad), the
# d-pad as a hat, the right stick on ABS_Z/ABS_RZ and the triggers on ABS_RX/ABS_RY - the same numbers as
# libretro's own "Sony DualShock 4" udev profile. (SDL drives this pad through its hidapi PS4 driver and
# numbers the buttons differently; do not copy SDL's mapping here.)
input_driver = "udev"
input_device = "Sony Interactive Entertainment PS4/PC/PS3/Android Gamepad"
input_vendor_id = "3090"
input_product_id = "3606"
input_device_display_name = "PS4/PC/PS3/Android Gamepad (Zeroplus)"

input_b_btn = "1"
input_a_btn = "2"
input_y_btn = "0"
input_x_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_l3_btn = "10"
input_r3_btn = "11"
input_menu_toggle_btn = "12"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+5"
input_r_y_minus_axis = "-5"
input_l2_axis = "+3"
input_r2_axis = "+4"

input_b_btn_label = "Cross"
input_a_btn_label = "Circle"
input_y_btn_label = "Square"
input_x_btn_label = "Triangle"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"
input_select_btn_label = "Share"
input_start_btn_label = "Options"
input_l3_btn_label = "L3"
input_r3_btn_label = "R3"
input_menu_toggle_btn_label = "PS"
