[drastic]
remap=drastic_sdl_remap.so
pad=psc-kernel
dpad2analog=0
analog2dpad=1
padnote=DraStic preloads its own drastic_sdl_remap.so, which works unchanged on the kernel pad (the console pad's name, buttons and d-pad axes); in the psc (shim) mode abpad stands in for it and does what it did (the d-pad as hat 0, its button numbers)
[commanderkeen]
pad=psc-kernel
dpad2analog=0
analog2dpad=1
padnote=Commander Genius has SDL 2.0.8 built in (no shim can reach it) and steers on joystick axes 0/1
[ppsspp]
pad=psc-kernel
dpad2analog=0
analog2dpad=1
padnote=PPSSPP loads the console pad's mapping by GUID (SDL2): the kernel pad has that identity; its d-pad is the left stick there
[tyrquake]
pad=psc-kernel
dpad2analog=0
analog2dpad=1
padnote=tyr-quake has SDL linked in statically (no shim can reach it) and reads the console pad's table by GUID
[openlara]
pad=psc-kernel
dpad2analog=0
analog2dpad=1
padnote=OpenLara opens /dev/input/event* itself (libudev, no SDL) and reads the console pad's ABS_X/ABS_Y and BTN_A..BTN_TR2
