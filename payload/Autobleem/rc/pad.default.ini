# The virtual gamepad's defaults for every App on this machine.
#
# An App can override any of this with a pad.ini of its own, in its own folder. See
# docs/virtual-gamepad-plan.md for what each setting means and why it exists.

# joystick | keyboard | both | off
#   joystick  the App is shown one well-known pad, whichever SDL API it reads
#   keyboard  the pad arrives as key presses, for a game that only knows a keyboard
#   both      the pad is a pad and a keyboard at once
#   off       the shim stands aside, except for the cursor below
mode = joystick

# the pad an App is shown: x360 (what nearly every Linux port was written against) or psc
virtual = x360

# how many pads the App is told it has. They are always there from its first call to its last - an
# unplugged one reads centred and unpressed - so no App has to cope with a joystick coming and going,
# which SDL 1.2 cannot express at all and many SDL2 ports handle badly. Hotplug is the daemon's.
players = 2

# held together, asks the App to quit. Several of these games have no other way out.
hotkey = start+select

# These machines have no mouse, so a cursor drawn over a game is wrong - and it is the App that asks
# for one, not the driver. "keep" gives it back to an App that genuinely wants it.
cursor = hide
