# The self-hosted GitHub Actions runner on the build server, as a container (the server is Ubuntu 18.04,
# older than the runner supports; the container brings its own userland). It talks to the host's Docker
# through the socket, which is how the workflows' `container:` jobs and docker/build-image.sh run.
#
#   cp .env.example .env      # fill in ACCESS_TOKEN (a fine-grained PAT with "Administration: read/write"
#                             # on the repo - the runner registers and re-registers itself with it)
#   docker compose up -d      # the runner appears under Settings -> Actions -> Runners
#   docker compose logs -f
#
# RUNNER_WORKDIR must be the same path inside and outside the container: a job's `container:` mounts the
# workspace by host path through the socket, so the runner's view and the daemon's view have to agree.
services:
  runner:
    image: myoung34/github-runner:latest
    container_name: autobleem-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/autobleem/AutoBleem2
      RUNNER_SCOPE: repo
      RUNNER_NAME: psc-build
      LABELS: linux,x64,psc-build
      RUNNER_WORKDIR: /srv/actions-runner/work
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      # docker/build-image.sh takes the cover databases from here (image.yml)
      AB_COVERS_DIR: /srv/autobleem-covers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/actions-runner/work:/srv/actions-runner/work
      - /AutoBleem/BUILD/data_that_gets_copied/cover_databases:/srv/autobleem-covers:ro
