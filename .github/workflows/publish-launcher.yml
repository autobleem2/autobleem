# Publish the launcher as its own per-platform artifact, for the assembly step (autobleem-appliance) to
# compose with the separately-published emulators/payload/themes - the compile-once/assemble-many model.
# This does NOT build the old monolithic package; it builds only the launcher tree (AB_NO_PCSX=1 uses the
# checked-in emulators, so no emulator repos are needed) and ships launcher-<platform>.tar.gz laid out as
# the payload the launcher repo contributes: Autobleem/bin/autobleem (autobleem-gui + resources),
# Autobleem/bin/abpad (the virtual-gamepad daemon + preload shim) and Themes/ (the five themes ship with the
# launcher - they stay in payload/Themes in the repo, no theme pack). Assembly extracts it over the payload.
# Gated by AB_CI_ENABLED.
name: publish-launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: launcher targets (space separated; rpi rpi64 pcusb)
        type: string
        default: 'rpi rpi64 pcusb'

concurrency:
  group: publish-launcher-${{ github.ref }}
  cancel-in-progress: true

env:
  AB_NO_PCSX: '1'

jobs:
  plan:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.t.outputs.json }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: t
        run: |
          t="${{ inputs.targets }}"; [ -n "$t" ] || t="rpi rpi64 pcusb"
          echo "json=$(printf '%s\n' $t | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "version=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Build the launcher (${{ matrix.target }})
        run: ci/build.sh ${{ matrix.target }}
      - name: Stage the launcher artifact
        id: stage
        run: |
          set -e
          case "${{ matrix.target }}" in
            rpi)   D=build_rpi;   P=rpi-armhf ;;
            rpi64) D=build_rpi64; P=rpi-arm64 ;;
            pcusb) D=build_pcusb; P=pcusb ;;
          esac
          V="${{ needs.plan.outputs.version }}"
          # the artifact mirrors the payload root the launcher repo contributes, so assembly
          # (autobleem-appliance) just extracts it over the staged payload:
          #   Autobleem/bin/autobleem  the gui + its resources
          #   Autobleem/bin/abpad      the virtual-gamepad daemon + preload shim
          #   Themes                   the five themes (owner's rule: themes stay in the repo, no theme pack)
          # The emulators, the payload skeleton, and the install-time downloads (cover DBs, samples) are
          # other components' artifacts / site fetches, not this one.
          BIN=stage/Autobleem/bin
          rm -rf stage out && mkdir -p "$BIN/autobleem" "$BIN/abpad" stage/Themes out
          cp "$D/autobleem-gui" "$BIN/autobleem/"
          upx -q --best --lzma "$BIN/autobleem/autobleem-gui" || true
          cp -a src/resources/. "$BIN/autobleem/"
          rm -f "$BIN/autobleem/internal.db"          # an appliance has no built-in games
          cp LICENSE THIRD_PARTY_NOTICES.md "$BIN/autobleem/" 2>/dev/null || true
          if [ -f "$D/apps/abpad/abpadd" ] && [ -f "$D/apps/abpad/libabpad.so" ]; then
            cp "$D/apps/abpad/abpadd" "$D/apps/abpad/libabpad.so" "$BIN/abpad/"
          else
            echo "::warning::no abpad built in $D/apps/abpad - Apps would run without the virtual gamepad"
          fi
          cp -a payload/Themes/. stage/Themes/
          find stage -type f -name placeholder -delete
          tar -czf "out/launcher-$P-$V.tar.gz" -C stage .
          echo "plat=$P" >> "$GITHUB_OUTPUT"
          echo "top: $(tar tzf out/launcher-$P-$V.tar.gz | sed 's#/.*##' | sort -u | tr '\n' ' ')"; ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ steps.stage.outputs.plat }}
          path: out/*.tar.gz
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: launcher-*, path: out, merge-multiple: true }
      - name: Attach launcher artifacts to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "AutoBleem ${GITHUB_REF_NAME}" --generate-notes $prerelease out/*.tar.gz || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" out/*.tar.gz --clobber
