# Publish the launcher as its own per-platform artifact, for the assembly step (autobleem-appliance) to
# compose with the separately-published emulators/payload/themes - the compile-once/assemble-many model.
# This does NOT build the old monolithic package; it builds only the launcher tree (AB_NO_PCSX=1 uses the
# checked-in emulators, so no emulator repos are needed) and ships launcher-<platform>.tar.gz laid out as
# the payload the launcher repo contributes: Autobleem/bin/autobleem (autobleem-gui + resources),
# Autobleem/bin/abpad (the virtual-gamepad daemon + preload shim) and Themes/ (the five themes ship with the
# launcher - they stay in payload/Themes in the repo, no theme pack). Assembly extracts it over the payload.
# The psc target's artifact also carries the psc skeleton (payload/'s exploit dir, Autobleem/rc,
# Autobleem/start.sh, Autobleem/lib/libs.tar.gz, Docs/, Games/) - autobleem-appliance's assemble-psc.sh has
# nowhere else to get it from, since payload/ lives only in this repo. Deliberately NOT included: RetroArch/
# (AutoBleemInstaller.exe fetches RetroArch, its cores/libs/apps packs and the BIOS files from the site at
# install time - the PC has network, the console never will) and Apps/ (autobleem-console-tools' own
# artifact). Gated by AB_CI_ENABLED.
name: publish-launcher

on:
  push:
    tags: ['v*']
    # develop too, for the rolling `nightly` pre-release the appliance's development build is assembled from
    branches: [develop]
    paths-ignore: ['docs/**', '**.md', 'manuals/**']
  workflow_dispatch:
    inputs:
      targets:
        description: launcher targets (space separated; rpi rpi64 pcusb psc win)
        type: string
        default: 'rpi rpi64 pcusb psc win'

concurrency:
  group: publish-launcher-${{ github.ref }}
  cancel-in-progress: true

env:
  AB_NO_PCSX: '1'

jobs:
  plan:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.t.outputs.json }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, submodules: recursive }
      - id: t
        run: |
          t="${{ inputs.targets }}"; [ -n "$t" ] || t="rpi rpi64 pcusb psc win"
          echo "json=$(printf '%s\n' $t | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          # a branch build is named as the launcher names itself (generate_version.cmake): the last v* tag,
          # the commits past it and the commit - v2.0.0-alpha2-5-gabc1234 - so the file says what it is
          else echo "version=$(git describe --tags --match 'v*' 2>/dev/null || echo "$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)")" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_DIR: /sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, submodules: recursive }
      # sccache with a local on-disk cache persisted across runs by actions/cache. NOT sccache's built-in
      # gha backend: GitHub retired the legacy artifact-cache API (v1) it calls. actions/cache@v6 uses the
      # current service, and ci/build.sh already runs sccache from PATH honouring SCCACHE_DIR. Caches are
      # per-repo and per-branch, evicted after 7 days unused - so the launcher's Caches page only fills once
      # this workflow has run. The rolling key (per-target + sha, prefix restore) warms each build from the
      # newest cache for that target.
      - name: Restore sccache cache
        uses: actions/cache@v6
        with:
          path: /sccache
          key: sccache-launcher-${{ matrix.target }}-${{ github.sha }}
          restore-keys: sccache-launcher-${{ matrix.target }}-
      - name: Build the launcher (${{ matrix.target }})
        run: ci/build.sh ${{ matrix.target }}
      - name: Stage the launcher artifact
        id: stage
        run: |
          set -e
          V="${{ needs.plan.outputs.version }}"
          if [ "${{ matrix.target }}" = win ]; then
            # the Windows product's share: the program folder make_win_package.sh --product staged (the
            # full-screen exe, resources, DLLs, Themes, dataroot.txt.example) as AutoBleem/, and the NSIS script
            # + icon as nsis/ - autobleem-appliance's assemble-win.sh adds both PS1 emulators (their win64
            # releases) and AutoBleemWinSetup.exe (autobleem-pc-tools') and builds AutoBleemSetup-<v>.exe
            PK=build_mingw_product/package/AutoBleem
            [ -f "$PK/autobleem-gui.exe" ] || { echo "::error::no $PK/autobleem-gui.exe"; exit 1; }
            rm -rf stage out && mkdir -p stage/nsis out
            cp -a "$PK" stage/AutoBleem
            rm -rf stage/AutoBleem/AutoBleemWinSetup.exe stage/AutoBleem/emu stage/AutoBleem/emunxt
            cp installer/windows/autobleem.nsi src/win/autobleem.ico stage/nsis/
            tar -czf "out/launcher-win64-$V.tar.gz" -C stage .
            echo "plat=win64" >> "$GITHUB_OUTPUT"; ls -l out
            exit 0
          fi
          # the artifact mirrors the payload root the launcher repo contributes, so assembly
          # extracts it straight over the staged payload:
          #   Autobleem/bin/autobleem  the gui + its resources (+ absplash/abfatflag/abupdate on psc)
          #   Autobleem/bin/abpad      the virtual-gamepad daemon + preload shim
          #   Themes                   the five themes (owner's rule: themes stay in the repo, no theme pack)
          # The emulators, the payload skeleton (payload_linux/ or payload/), the console tools
          # (pscbios/abflashkit), and the install-time downloads (cover DBs, samples, RetroArch-psc) are
          # other components' artifacts / site fetches, not this one.
          BIN=stage/Autobleem/bin
          rm -rf stage out && mkdir -p "$BIN/autobleem" "$BIN/abpad" stage/Themes out
          if [ "${{ matrix.target }}" = psc ]; then
            D=build_psc; P=psc
            # absplash (the full-screen picture around a launch) and abfatflag (the stick's dirty flag) are
            # psc-only tools built alongside the launcher - the Linux appliances have neither.
            cp "$D/autobleem-gui" "$D/absplash" "$D/abfatflag" "$D/abupdate" "$BIN/autobleem/"
            upx -q --best --lzma "$BIN/autobleem/autobleem-gui" "$BIN/autobleem/absplash" "$BIN/autobleem/abupdate" || true
            cp -a src/resources/. "$BIN/autobleem/"
            # internal.db KEPT here (unlike the Linux appliances): the console has built-in games
            # (AB_HAS_INTERNAL_GAMES is psc/dev only)
          else
            case "${{ matrix.target }}" in
              rpi)   D=build_rpi;   P=rpi-armhf ;;
              rpi64) D=build_rpi64; P=rpi-arm64 ;;
              pcusb) D=build_pcusb; P=pcusb ;;
            esac
            cp "$D/autobleem-gui" "$BIN/autobleem/"
            upx -q --best --lzma "$BIN/autobleem/autobleem-gui" || true
            cp -a src/resources/. "$BIN/autobleem/"
            rm -f "$BIN/autobleem/internal.db"          # an appliance has no built-in games
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md "$BIN/autobleem/" 2>/dev/null || true
          if [ -f "$D/apps/abpad/abpadd" ] && [ -f "$D/apps/abpad/libabpad.so" ]; then
            cp "$D/apps/abpad/abpadd" "$D/apps/abpad/libabpad.so" "$BIN/abpad/"
          else
            echo "::warning::no abpad built in $D/apps/abpad - Apps would run without the virtual gamepad"
          fi
          cp -a payload/Themes/. stage/Themes/
          if [ "${{ matrix.target }}" = psc ]; then
            # the psc skeleton this repo owns and nothing else has: the exploit dir, Autobleem/{rc,start.sh},
            # Autobleem/lib/libs.tar.gz (the SDL2 libs rc/autobleem.sh unpacks to /tmp/lib at boot - see
            # below), Docs/ and Games/. RetroArch/ and Apps/ are deliberately left out: the assembler
            # bundles neither - RetroArch, its cores/libs/apps packs and the BIOS files are all fetched by
            # AutoBleemInstaller.exe at install time (the PC has network, the console never will), and Apps/
            # (pscbios, abflashkit) is autobleem-console-tools' own artifact.
            find payload -maxdepth 1 -mindepth 1 ! -name Apps ! -name RetroArch ! -name Autobleem ! -name Themes \
              -exec cp -a {} stage/ \;
            cp -a payload/Autobleem/rc payload/Autobleem/start.sh stage/Autobleem/
            # libs.tar.gz: the SDL2 family the launcher was just built against (the image's /opt/psc/sdl2 -
            # SDL2 2.0.12, image/mixer 2.6.3, ttf 2.20.2) replaces the checked-in archive's 2019/2020 SDL2
            # libs; the rest of it (libiconv, libogg, libvorbis*) stays, macOS ._* forks and the "name 2"
            # duplicates go. tools/make_psc_package.sh does the same. The checked-in archive alone does not
            # run this launcher: its SDL2_mixer 2.0.x has no Mix_LoadWAV symbol (a macro there), and the
            # launcher dies at start with "undefined symbol: Mix_LoadWAV".
            SDL_LIB=/opt/psc/sdl2/lib
            ls "$SDL_LIB"/libSDL2-2.0.so.0.* "$SDL_LIB"/libSDL2_mixer-2.0.so.0.* >/dev/null \
              || { echo "::error::no SDL2 build in $SDL_LIB - cannot make libs.tar.gz"; exit 1; }
            LIBS="$PWD/stage-libs"; rm -rf "$LIBS"; mkdir -p "$LIBS" stage/Autobleem/lib
            tar -xzf payload/Autobleem/lib/libs.tar.gz -C "$LIBS" --exclude='._*' --exclude='* *' --exclude='libSDL2*'
            cp -P "$SDL_LIB"/libSDL2*.so* "$LIBS/"
            (cd "$LIBS" && tar -czf "$OLDPWD/stage/Autobleem/lib/libs.tar.gz" --owner=0 --group=0 .)
            rm -rf "$LIBS"
            tar -tzf stage/Autobleem/lib/libs.tar.gz | grep -q 'libSDL2_mixer-2.0.so.0.[1-9][0-9][0-9]' \
              || { echo "::error::libs.tar.gz has no SDL2_mixer 2.x (x >= 1)"; exit 1; }
            echo "libs.tar.gz: $(tar -tzf stage/Autobleem/lib/libs.tar.gz | grep -E '\.so\.[0-9]+\.[0-9]+' | sed 's|^\./||' | tr '\n' ' ')"
          fi
          find stage -type f -name placeholder -delete
          tar -czf "out/launcher-$P-$V.tar.gz" -C stage .
          echo "plat=$P" >> "$GITHUB_OUTPUT"
          echo "top: $(tar tzf out/launcher-$P-$V.tar.gz | sed 's#/.*##' | sort -u | tr '\n' ' ')"; ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ steps.stage.outputs.plat }}
          path: out/*.tar.gz
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: launcher-*, path: out, merge-multiple: true }
      - name: Attach launcher artifacts to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "AutoBleem ${GITHUB_REF_NAME}" --generate-notes $prerelease out/*.tar.gz || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" out/*.tar.gz --clobber

  # the rolling development build: every successful build of develop replaces the assets of the `nightly`
  # pre-release (autobleem-build's nightly-release action), which autobleem-appliance's nightly assembly
  # fetches the way it fetches a v* release. A partial manual run (fewer targets) would leave the others out,
  # so only a push publishes it.
  nightly:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: launcher-*, path: out, merge-multiple: true }
      - uses: autobleem2/autobleem-build/.github/actions/nightly-release@master
        with:
          files: out/*.tar.gz
          version: ${{ needs.plan.outputs.version }}
