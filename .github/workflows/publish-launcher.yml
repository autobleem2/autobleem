# Publish the launcher as its own per-platform artifact (autobleem-gui + resources), for the assembly step
# (autobleem-appliance) to compose with the separately-published emulators/themes - the compile-once/
# assemble-many model. This does NOT build the old monolithic package; it builds only the launcher binary
# (AB_NO_PCSX=1 uses the checked-in emulators, so no emulator repos are needed) and ships launcher-<platform>.
# Gated by AB_CI_ENABLED.
name: publish-launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: launcher targets (space separated; rpi rpi64 pcusb)
        type: string
        default: 'rpi rpi64 pcusb'

concurrency:
  group: publish-launcher-${{ github.ref }}
  cancel-in-progress: true

env:
  AB_NO_PCSX: '1'

jobs:
  plan:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.t.outputs.json }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: t
        run: |
          t="${{ inputs.targets }}"; [ -n "$t" ] || t="rpi rpi64 pcusb"
          echo "json=$(printf '%s\n' $t | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "version=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:latest
      credentials: { username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Build the launcher (${{ matrix.target }})
        run: ci/build.sh ${{ matrix.target }}
      - name: Stage the launcher artifact
        id: stage
        run: |
          set -e
          case "${{ matrix.target }}" in
            rpi)   D=build_rpi;   P=rpi-armhf ;;
            rpi64) D=build_rpi64; P=rpi-arm64 ;;
            pcusb) D=build_pcusb; P=pcusb ;;
          esac
          V="${{ needs.plan.outputs.version }}"
          rm -rf launcher out && mkdir -p launcher out
          cp "$D/autobleem-gui" launcher/
          upx -q --best --lzma launcher/autobleem-gui || true
          cp -a src/resources/. launcher/
          rm -f launcher/internal.db
          cp LICENSE THIRD_PARTY_NOTICES.md launcher/ 2>/dev/null || true
          tar -czf "out/launcher-$P-$V.tar.gz" -C launcher .
          echo "plat=$P" >> "$GITHUB_OUTPUT"
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ steps.stage.outputs.plat }}
          path: out/*.tar.gz
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: launcher-*, path: out, merge-multiple: true }
      - name: Attach launcher artifacts to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "AutoBleem ${GITHUB_REF_NAME}" --generate-notes $prerelease out/*.tar.gz || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" out/*.tar.gz --clobber
