variables:
  GIT_SUBMODULE_STRATEGY: normal

.build:
  stage: build
  tags:
    - docker
  image: "docker.io/screemer/psc-toolchain5:latest"
  script:
    - "# Build binary"
    - rm -rf build_temp
    - mkdir build_temp
    - cd build_temp
    - cmake -DCMAKE_SYSTEM_PROCESSOR="${ARCH}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=../DockerToolchain.cmake ..
    - make
    - cd ..
    - rm -rf build_output
    - mkdir build_output
    - cp -r package/* build_output/
    - cp -r build_temp/ABFlashKit build_output/
  artifacts:
    paths:
      - build_output/

arm:
  extends: .build
  variables:
    ARCH: Arm


